<template>
    <div>
        <lightning-card title="Show Toast Event Messages" icon-name="standard:account">
           
            <lightning-button label="Success Toast"
                              variant="success"
                              onclick={handleSuccessToast}
                              class="slds-m-around_medium"></lightning-button>
            
            <lightning-button label="Error Toast"
                              variant="destructive"
                              onclick={handleErrorToast}
                              class="slds-m-around_medium"></lightning-button>

                
            <lightning-button label="Warning Toast"
                              variant="destructive-text"
                              onclick={handleWarningToast}
                              class="slds-m-around_medium"></lightning-button>

            <lightning-button label="Info Toast"
                              variant="brand"
                              onclick={handleInfoToast}
                              class="slds-m-around_medium"></lightning-button>
        </lightning-card>
    </div>
</template>
