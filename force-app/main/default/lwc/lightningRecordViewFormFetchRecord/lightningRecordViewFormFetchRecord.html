<template>
    <lightning-card title="Lead Record Details" icon-name="standard:lead"></lightning-card><br/>
    <lightning-record-view-form 
                                record-id={recordId}
                                object-api-name={objectApiName}>

    <table>
        <tr>
            <td><lightning-output-field field-name="FirstName"></lightning-output-field></td>
            <td> <lightning-output-field field-name="LastName"></lightning-output-field></td>
        </tr>

        <tr>
            <td><lightning-output-field field-name="Company"></lightning-output-field></td>
            <td> <lightning-output-field field-name="Status"></lightning-output-field></td>
        </tr>

        <tr>
            <td><lightning-output-field field-name="Industry"></lightning-output-field></td>
            <td><lightning-output-field field-name="AnnualRevenue"></lightning-output-field></td>
        </tr>

        <tr>
            <td><lightning-output-field field-name="Title"></lightning-output-field></td>
            <td><lightning-output-field field-name="Rating"></lightning-output-field></td>
        </tr>

        <tr>
            <td><lightning-output-field field-name="LeadSource"></lightning-output-field></td>
            <td> <lightning-output-field field-name="Phone"></lightning-output-field> </td>
        </tr>

        <tr>
            <td><lightning-output-field field-name="Email"></lightning-output-field></td>
            <td><lightning-output-field field-name="Website"></lightning-output-field></td>
        </tr>

        <tr>
            <td><lightning-output-field field-name="City"></lightning-output-field></td>
            <td><lightning-output-field field-name="State"></lightning-output-field></td>
        </tr>

        <tr>
            <td><lightning-output-field field-name="PostalCode"></lightning-output-field></td>
            <td><lightning-output-field field-name="Country"></lightning-output-field></td>
        </tr>
    </table>

    </lightning-record-view-form>
</template>
